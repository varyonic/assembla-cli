[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assembla-cli"
version = "0.1.0"
description = "CLI tool for Assembla ticket management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/eugene-software/assembla-cli"
Repository = "https://github.com/eugene-software/assembla-cli"
Issues = "https://github.com/eugene-software/assembla-cli/issues"

[project.scripts]
assembla = "assembla_cli.main:cli"

[tool.setuptools.packages.find]
include = ["assembla_cli*"]
